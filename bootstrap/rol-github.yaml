AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Configuración inicial (se crea una sola vez desde la consola de CloudFormation):
  permite que GitHub Actions despliegue en esta cuenta sin claves de acceso guardadas,
  usando OpenID Connect (OIDC) y un rol limitado al repositorio del equipo.

Parameters:
  PropietarioGitHub:
    Type: String
    Description: Usuario u organización de GitHub dueña del repositorio (por ejemplo, marylunasalcedohoyos).
  RepositorioGitHub:
    Type: String
    Default: plataforma-analisis-poc
    Description: Nombre del repositorio.
  CrearProveedorOIDC:
    Type: String
    AllowedValues: ["si", "no"]
    Default: "si"
    Description: Elija "no" solo si la cuenta ya tiene el proveedor token.actions.githubusercontent.com.

Conditions:
  CrearProveedor: !Equals [!Ref CrearProveedorOIDC, "si"]

Resources:
  ProveedorGitHub:
    Type: AWS::IAM::OIDCProvider
    Condition: CrearProveedor
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  RolDespliegueGitHub:
    Type: AWS::IAM::Role
    Properties:
      RoleName: plataforma-github-despliegue
      Description: Rol que asume GitHub Actions para validar y desplegar la plataforma.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              # Con !Ref al proveedor, CloudFormation crea primero el proveedor y después el rol
              # (si el rol se crea antes, IAM rechaza la política por "Invalid principal").
              Federated: !If
                - CrearProveedor
                - !Ref ProveedorGitHub
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Se aceptan las dos formas del identificador de GitHub (con y sin IDs numéricos).
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${PropietarioGitHub}/${RepositorioGitHub}:*
                  - !Sub repo:${PropietarioGitHub}@*/${RepositorioGitHub}@*:*
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: roles-de-la-plataforma
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: GestionarSoloRolesDeLaPlataforma
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListRoleTags
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/plataforma-*

Outputs:
  ArnRolDespliegue:
    Description: Copie este valor en la variable AWS_ROLE_ARN del repositorio en GitHub.
    Value: !GetAtt RolDespliegueGitHub.Arn
